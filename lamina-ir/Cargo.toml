[package]
name = "lamina-ir"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Eira <eira@nornity.com>"]
description = "Lamina Intermediate Representation — high-level typed IR for the Lamina compiler"
license = "Apache-2.0"
keywords = ["compiler", "IR", "typed-ir"]
categories = ["compilers", "development-tools"]
repository = "https://github.com/Project-Lamina/lamina"

[dependencies]
lamina-platform = { path = "../lamina-platform", version = "0.2.1" }

[features]
default = []
nightly = ["lamina-platform/nightly"]

[lints]
workspace = true
