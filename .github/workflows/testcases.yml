name: testcases

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit:
    name: "unit tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # LAMINA_REQUIRE_TOOLS below turns a missing tool into a failure, so every
      # tool a test reaches for has to be here. The cross compilers and emulators
      # are what let the integer and testcase checks run on targets other than
      # this runner's own.
      - name: Install test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib libc6-dev-i386 \
            lld-18 llvm-18 \
            qemu-user-static
      # The wasm backend tests run their output under the wasmtime CLI. Without
      # it they skip, and the backend goes untested while the job stays green.
      - name: Install wasmtime
        if: runner.os == 'Linux'
        run: |
          version=v50.0.0
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${version}/wasmtime-${version}-x86_64-linux.tar.xz" -o wasmtime.tar.xz
          tar xf wasmtime.tar.xz
          echo "$PWD/wasmtime-${version}-x86_64-linux" >> "$GITHUB_PATH"
      # A test that cannot find its tool skips and still reports success, so on
      # Linux a missing tool is a failure instead. The other two runners keep
      # skipping, since they do not carry the cross toolchains.
      - name: Test
        run: cargo test --workspace --verbose
        env:
          LAMINA_REQUIRE_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}

      # The macOS lib test binary exits with SIGSEGV after every test passes, so the
      # fault is in teardown and no test name identifies it. Capture the crash report
      # and a backtrace so the next run says where.
      - name: Crash report
        if: failure() && runner.os == 'macOS'
        run: |
          sleep 5
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          bin=$(ls -t target/debug/deps/lamina-* | grep -v '\.d$' | head -1)
          echo "=== lldb backtrace: $bin ==="
          lldb --batch -o run -o 'bt all' -o quit -- "$bin" --test-threads=1 2>&1 | tail -60

  # Compiles each program in testcases/, runs it, and diffs against its .expected
  # file. This is the only job that checks the compiler produces correct programs
  # rather than merely building.
  #
  # Every platform is required. Windows and macOS ran with --report-only while
  # the Win64 ABI and the AArch64 backend were incomplete; both now pass every
  # testcase, and four macOS binaries segfaulted behind that flag for weeks
  # because a reported failure still exited 0.
  testcases:
    name: "testcases (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # weld is a bin target of this crate, so this places it beside lamina and no
      # separate install step can leave a stale linker behind. GNU ld cannot produce
      # PE or Mach-O, so without weld every testcase on Windows and macOS would fail
      # at the link step and the count would say nothing about codegen.
      - name: Build compiler
        run: cargo build --release
      # run_tests.py decides what counts as a crash, which testcase a target
      # variant replaces, and whether a missing .expected is a failure. Nothing
      # else checks that logic.
      - name: Test the testcase runner
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q
      - name: Run testcases
        run: python3 run_tests.py

      # The aarch64 backend is only exercised by compiling for it and running the
      # result under an emulator. Building alone proved nothing about it, and the
      # host runner is x86_64.
      - name: Install cross toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-s390x-linux-gnu qemu-user-static
      - name: Run testcases (aarch64 linux)
        if: runner.os == 'Linux'
        run: python3 run_tests.py --target aarch64_linux
      # s390x is the only big-endian target in the suite, so it is what catches a
      # byte-order assumption baked into codegen.
      - name: Run testcases (s390x linux)
        if: runner.os == 'Linux'
        run: python3 run_tests.py --target s390x_linux

      # A crashed testcase writes no stdout and usually no stderr, so the exit
      # status alone does not say where it died. run_tests.py lists the crashed
      # binaries; re-run each under a debugger and print the system crash report.
      # Diagnostic only: a debugger that cannot produce a backtrace must not turn
      # a reported crash into a second, unrelated job failure.
      - name: Crash reports
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          list=target/crashes.txt
          [ -s "$list" ] || { echo "no crashes recorded"; exit 0; }
          echo "=== crashed binaries ==="
          cat "$list"
          while IFS=$'\t' read -r bin reason; do
            [ -x "$bin" ] || continue
            echo "=== $bin ($reason) ==="
            case "${{ runner.os }}" in
              macOS)
                lldb --batch -o run -o 'bt all' -o quit -- "$bin" 2>&1 | tail -40 || true
                ;;
              Linux)
                if command -v gdb >/dev/null; then
                  gdb -batch -ex run -ex 'bt' --args "$bin" 2>&1 | tail -40 || true
                fi
                ;;
              Windows)
                echo "no debugger wired up on Windows yet"
                ;;
            esac
          done < "$list"
          if [ "${{ runner.os }}" = "macOS" ]; then
            for f in ~/Library/Logs/DiagnosticReports/*.ips; do
              [ -e "$f" ] || continue
              echo "=== $f ==="
              head -60 "$f"
            done
          fi

  # Static codegen metrics (instruction, spill, call, branch and frame counts per
  # testcase per opt level) compared against metrics/baseline-x86_64.txt. Any
  # difference fails this job. A codegen change therefore needs the baseline
  # regenerated and committed in the same PR, so the diff is reviewed. See
  # metrics/README.md. Linux only: the metrics are x86_64 and the baseline is
  # pinned to --target x86_64_linux.
  codegen-metrics:
    name: "codegen metrics (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build compiler
        run: cargo build --release
      - name: Check codegen metrics against baseline
        run: python3 metrics/codegen_metrics.py --check
