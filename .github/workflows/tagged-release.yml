---
name: "tagged-release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --verbose

      - name: Install 32-bit runtime
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386
      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Upload Rust binary
        uses: actions/upload-artifact@v7
        with:
          name: lamina-binary
          path: target/release/lamina
          if-no-files-found: error

  c-sdk:
    name: "C SDK (${{ matrix.target }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sdk-${{ hashFiles('lamina-c/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sdk-

      - name: C SDK tests (stable + nightly)
        working-directory: lamina-c
        run: |
          cargo test
          cargo test --features nightly

      - name: Build stable SDK archive
        working-directory: lamina-c
        run: bash scripts/build-sdk.sh --release

      - name: Build nightly SDK archive
        working-directory: lamina-c
        run: bash scripts/build-sdk.sh --release --nightly

      - uses: actions/upload-artifact@v7
        with:
          name: c-sdk-${{ matrix.target }}
          path: lamina-c/dist/
          if-no-files-found: error

  release:
    name: "Publish tagged release"
    needs: [build, c-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Metadata
        id: meta
        run: |
          manifest_version() {
            grep '^version' "$1" | head -1 | sed 's/.*= *"\(.*\)"/\1/'
          }
          LAMINA_VERSION=$(manifest_version Cargo.toml)
          if [ "v${LAMINA_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not name lamina ${LAMINA_VERSION}" >&2
            exit 1
          fi
          # The C SDK archives are named by lamina-c, which versions separately.
          echo "sdk_version=$(manifest_version lamina-c/Cargo.toml)" >> "$GITHUB_OUTPUT"

      # The notes are rewritten two steps down, so nothing here generates a
      # changelog. Walking every commit back to the previous tag is what broke
      # this step on v0.2.0.
      - name: Publish release (permanent — never deleted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lamina ${GITHUB_REF_NAME}" \
            --notes "Release notes follow." \
            artifacts/lamina \
            artifacts/*.tar.gz \
            artifacts/*.sha256

      - name: Generate release notes from conventional commits
        run: bash .github/scripts/release-notes.sh > release-notes.md

      - name: Append C SDK info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.meta.outputs.sdk_version }}
          TAG=${GITHUB_REF_NAME}
          NOTES_FILE=$(mktemp)
          {
            cat release-notes.md
            echo ""
            echo "---"
            echo ""
            echo "### C SDK ${VERSION}"
            echo ""
            echo "| Archive | Target | Surface |"
            echo "|---------|--------|---------|"
            echo "| \`lamina-c-${VERSION}-stable-x86_64-linux.tar.gz\` | x86_64-linux | Stable AOT (\`lamina.h\`) |"
            echo "| \`lamina-c-${VERSION}-nightly-x86_64-linux.tar.gz\` | x86_64-linux | + JIT (\`lamina_nightly.h\`) |"
            echo ""
            echo "Each archive includes headers, static + shared library, examples, pkg-config, LICENSE."
            echo ""
            echo '```sh'
            echo "tar xzf lamina-c-${VERSION}-stable-x86_64-linux.tar.gz"
            echo "cd lamina-c-${VERSION}-stable-x86_64-linux"
            echo "cc examples/builder_aot.c -I include -L lib -llamina_c -Wl,-rpath,\$(pwd)/lib -o builder_aot"
            echo "./builder_aot"
            echo '```'
            echo ""
            echo "Verify checksums: \`sha256sum -c lamina-c-${VERSION}-stable-x86_64-linux.tar.gz.sha256\`"
          } > "$NOTES_FILE"
          gh release edit "$TAG" --notes-file "$NOTES_FILE"
